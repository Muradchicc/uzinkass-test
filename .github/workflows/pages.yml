name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          # Internetdagi sahifa serversiz, shu Apps Script Web App bilan ishlaydi
          VITE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzBz5f7OmXN82zYh2jtX8eVcuwNgiUf4pb_WLlLIHkL6cDwLIJVvb_TUNhbqoQU9xk2PQ/exec
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deployment
        uses: actions/deploy-pages@v4
